<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      /* Der Besucher wandert von Standpunkt zu Standpunkt durch das Objekt,
         der Blickkegel dreht sich dabei - wie beim virtuellen Rundgang. */
      @keyframes walk  { 0%      { transform: translate(0, 0); }
                         28%     { transform: translate(58px, -26px); }
                         56%     { transform: translate(104px, 10px); }
                         84%     { transform: translate(46px, 34px); }
                         100%    { transform: translate(0, 0); } }
      @keyframes look  { 0%,100% { transform: rotate(0deg); }
                         25%     { transform: rotate(84deg); }
                         50%     { transform: rotate(190deg); }
                         75%     { transform: rotate(276deg); } }
      @keyframes lift  { 0%, 12% { opacity: 0; transform: translateY(9px); }
                         30%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes glow  { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

      .walker { transform-box: view-box; animation: walk 9s ease-in-out infinite; }
      .look   { transform-box: fill-box; transform-origin: center;
                animation: look 9s ease-in-out infinite; }
      .stop   { animation: glow 3s ease-in-out infinite; }
      .s2 { animation-delay: .5s } .s3 { animation-delay: 1s } .s4 { animation-delay: 1.5s }
      .up     { transform-box: fill-box; animation: lift 9s ease-out infinite; }
      .u2 { animation-delay: .18s } .u3 { animation-delay: .36s }

      @media (prefers-reduced-motion: reduce) {
        .walker, .look, .stop, .up { animation: none; opacity: 1; transform: none; }
      }
    ]]></style>
  </defs>

  <!-- Ladenfront, die sich aufbaut -->
  <g class="up" stroke="url(#tg)" stroke-width="2.6" stroke-linejoin="round" fill="none">
    <path d="M58 108V54h204v54"/>
    <path d="M58 54 78 30h164l20 24"/>
  </g>
  <g class="up u2" stroke="#93A7C4" stroke-width="2.2" opacity=".65" fill="none">
    <rect x="86" y="66" width="46" height="30" rx="3"/>
    <rect x="146" y="66" width="46" height="30" rx="3"/>
    <rect x="206" y="66" width="30" height="30" rx="3"/>
  </g>

  <!-- Grundriss als Boden -->
  <g class="up u3">
    <path d="M40 128h240v150H40z" stroke="#93A7C4" stroke-width="2.4" opacity=".45" fill="rgba(34,211,238,.03)"/>
    <path d="M40 206h96M136 128v78M204 206h76M204 206v72" stroke="#93A7C4" stroke-width="2" opacity=".3"/>
  </g>

  <!-- Standpunkte des Rundgangs -->
  <g fill="#8B5CF6">
    <circle class="stop"    cx="86"  cy="242" r="5"/>
    <circle class="stop s2" cx="144" cy="216" r="5"/>
    <circle class="stop s3" cx="190" cy="252" r="5"/>
    <circle class="stop s4" cx="132" cy="276" r="5"/>
  </g>
  <path d="M86 242 144 216 190 252 132 276Z" stroke="#8B5CF6" stroke-width="1.8"
        stroke-dasharray="5 6" opacity=".45" fill="none"/>

  <!-- Besucher mit Blickkegel -->
  <g class="walker">
    <g class="look">
      <path d="M86 242 L52 200 L120 200 Z" fill="url(#cone)"/>
    </g>
    <circle cx="86" cy="242" r="10" fill="#0F1828" stroke="url(#tg)" stroke-width="3"/>
    <circle cx="86" cy="242" r="3.5" fill="#22D3EE"/>
  </g>
</svg>
