<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380" role="img" aria-label="Schematische Darstellung des Berichtsaufbaus">
  <title>Aufbau des Berichts</title>
  <!-- BEWUSST OHNE LESBAREN TEXT: Das hier ist ein Aufbau-Schema, kein
       Dokument. Sobald echte Inhalte drinstuenden, waere es ein erfundener
       Bericht - und genau das darf es nicht sein. Graue Balken stehen fuer
       Text, die farbigen Punkte fuer die Dringlichkeitsstufen. -->
  <style><![CDATA[
    .blatt  { fill: #F4F7FB; }
    .kante  { fill: none; stroke: rgba(148,163,184,.35); stroke-width: 1; }
    .zeile  { fill: #C3CEDD; }
    .zeile2 { fill: #D6DFEA; }
    .titel  { fill: #8FA2B8; }
    .feld   { fill: #E4EBF3; }
    .blaettern { animation: blaettern 9s ease-in-out infinite; transform-origin: 150px 190px; }
    @keyframes blaettern {
      0%, 44%   { transform: translateY(0) rotate(0deg); }
      52%, 96%  { transform: translateY(-7px) rotate(-.6deg); }
      100%      { transform: translateY(0) rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) { .blaettern { animation: none; } }
  ]]></style>

  <defs>
    <linearGradient id="waerme" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1E3A8A"/>
      <stop offset=".38" stop-color="#7C3AED"/>
      <stop offset=".68" stop-color="#F97316"/>
      <stop offset="1"   stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="kopfband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6428"/>
      <stop offset=".4" stop-color="#D6A952"/>
      <stop offset="1" stop-color="#F8DDA7"/>
    </linearGradient>
    <filter id="schatten" x="-20%" y="-12%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020610" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- hinteres Blatt, nur angedeutet -->
  <rect x="26" y="24" width="248" height="330" rx="6" class="blatt" opacity=".35" filter="url(#schatten)"/>

  <g class="blaettern" filter="url(#schatten)">
    <!-- Deckblatt -->
    <rect x="16" y="14" width="256" height="342" rx="7" class="blatt"/>
    <rect x="16" y="14" width="256" height="342" rx="7" class="kante"/>

    <!-- Kopfleiste in Gold -->
    <rect x="16" y="14" width="256" height="8" rx="4" fill="url(#kopfband)"/>

    <!-- Titelzeilen -->
    <rect x="34" y="38" width="112" height="9"  rx="4.5" class="titel"/>
    <rect x="34" y="54" width="72"  height="6"  rx="3"   class="zeile2"/>

    <!-- Wärmebild-Kachel -->
    <rect x="34" y="74" width="106" height="76" rx="5" fill="url(#waerme)"/>
    <rect x="34" y="74" width="106" height="76" rx="5" class="kante"/>
    <!-- Messpunkt-Fadenkreuz auf der Kachel -->
    <circle cx="92" cy="112" r="9" fill="none" stroke="#fff" stroke-width="1.4" opacity=".85"/>
    <path d="M92 99v6M92 119v6M79 112h6M99 112h6" stroke="#fff" stroke-width="1.4" opacity=".85"/>

    <!-- Foto-Kachel daneben -->
    <rect x="150" y="74" width="106" height="76" rx="5" class="feld"/>
    <rect x="150" y="74" width="106" height="76" rx="5" class="kante"/>
    <path d="M158 138l22-24 17 18 13-12 30 30H158z" fill="#C3CEDD"/>
    <circle cx="228" cy="94" r="7" fill="#D6DFEA"/>

    <!-- Fließtext -->
    <rect x="34" y="166" width="222" height="6" rx="3" class="zeile"/>
    <rect x="34" y="178" width="200" height="6" rx="3" class="zeile2"/>
    <rect x="34" y="190" width="214" height="6" rx="3" class="zeile2"/>

    <!-- Mängelliste: Punkt = Dringlichkeit -->
    <g>
      <circle cx="40" cy="216" r="4.5" fill="#DC2626"/>
      <rect x="52" y="212" width="150" height="7" rx="3.5" class="zeile"/>
      <rect x="212" y="212" width="44"  height="7" rx="3.5" class="zeile2"/>
    </g>
    <g>
      <circle cx="40" cy="236" r="4.5" fill="#F59E0B"/>
      <rect x="52" y="232" width="126" height="7" rx="3.5" class="zeile"/>
      <rect x="212" y="232" width="44"  height="7" rx="3.5" class="zeile2"/>
    </g>
    <g>
      <circle cx="40" cy="256" r="4.5" fill="#F59E0B"/>
      <rect x="52" y="252" width="164" height="7" rx="3.5" class="zeile"/>
    </g>
    <g>
      <circle cx="40" cy="276" r="4.5" fill="#16A34A"/>
      <rect x="52" y="272" width="138" height="7" rx="3.5" class="zeile"/>
      <rect x="212" y="272" width="44"  height="7" rx="3.5" class="zeile2"/>
    </g>
    <g>
      <circle cx="40" cy="296" r="4.5" fill="#16A34A"/>
      <rect x="52" y="292" width="110" height="7" rx="3.5" class="zeile"/>
    </g>

    <!-- Fußbereich: Fazit-Kasten -->
    <rect x="34" y="316" width="222" height="26" rx="5" fill="#E9F0F8"/>
    <rect x="34" y="316" width="3"   height="26" rx="1.5" fill="#22D3EE"/>
    <rect x="46" y="322" width="128" height="6" rx="3" class="zeile"/>
    <rect x="46" y="332" width="92"  height="5" rx="2.5" class="zeile2"/>
  </g>
</svg>
