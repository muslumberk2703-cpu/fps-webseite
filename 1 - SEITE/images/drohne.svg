<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 66" width="132" height="66" role="img" aria-label="Drohne">
  <title>Drohne</title>
  <!-- Die Rotoren drehen im SVG selbst. Externes CSS erreicht ein per
       img eingebundenes SVG nicht, deshalb steht der Stil hier drin. -->
  <style><![CDATA[
    .rotor { transform-box: fill-box; transform-origin: center; animation: dreh .35s linear infinite; }
    .r2 { animation-duration: .3s; }
    .r3 { animation-duration: .38s; }
    .r4 { animation-duration: .33s; }
    @keyframes dreh { to { transform: rotate(360deg); } }
    .blitz { animation: blinken 1.6s steps(2) infinite; }
    @keyframes blinken { 50% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) {
      .rotor, .blitz { animation: none; }
    }
  ]]></style>

  <defs>
    <linearGradient id="k2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6C81A1"/>
      <stop offset="1" stop-color="#2B384C"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8194B0"/>
      <stop offset="1" stop-color="#495B76"/>
    </linearGradient>
  </defs>

  <!-- Ausleger -->
  <g stroke="url(#arm)" stroke-width="3.4" stroke-linecap="round">
    <path d="M52 28 26 20"/>
    <path d="M80 28 106 20"/>
    <path d="M53 36 28 45"/>
    <path d="M79 36 104 45"/>
  </g>

  <!-- Rotorebenen: heller Ring + drehendes Blattpaar -->
  <g>
    <ellipse cx="26" cy="20" rx="17" ry="4.6" fill="rgba(120,205,235,.10)" stroke="rgba(120,205,235,.34)" stroke-width="1"/>
    <g class="rotor"><ellipse cx="26" cy="20" rx="16" ry="1.5" fill="rgba(198,226,244,.55)"/></g>
    <circle cx="26" cy="20" r="2.6" fill="#8398B6"/>
  </g>
  <g>
    <ellipse cx="106" cy="20" rx="17" ry="4.6" fill="rgba(120,205,235,.10)" stroke="rgba(120,205,235,.34)" stroke-width="1"/>
    <g class="rotor r2"><ellipse cx="106" cy="20" rx="16" ry="1.5" fill="rgba(198,226,244,.55)"/></g>
    <circle cx="106" cy="20" r="2.6" fill="#8398B6"/>
  </g>
  <g>
    <ellipse cx="28" cy="45" rx="18" ry="4.9" fill="rgba(120,205,235,.10)" stroke="rgba(120,205,235,.34)" stroke-width="1"/>
    <g class="rotor r3"><ellipse cx="28" cy="45" rx="17" ry="1.6" fill="rgba(206,232,248,.6)"/></g>
    <circle cx="28" cy="45" r="2.8" fill="#8398B6"/>
  </g>
  <g>
    <ellipse cx="104" cy="45" rx="18" ry="4.9" fill="rgba(120,205,235,.10)" stroke="rgba(120,205,235,.34)" stroke-width="1"/>
    <g class="rotor r4"><ellipse cx="104" cy="45" rx="17" ry="1.6" fill="rgba(206,232,248,.6)"/></g>
    <circle cx="104" cy="45" r="2.8" fill="#8398B6"/>
  </g>

  <!-- Korpus -->
  <rect x="48" y="24" width="36" height="15" rx="6.5" fill="url(#k2)" stroke="rgba(214,169,82,.45)" stroke-width="1"/>
  <rect x="53" y="27" width="14" height="4.5" rx="2" fill="rgba(226,240,252,.28)"/>
  <!-- Positionslicht -->
  <circle class="blitz" cx="79" cy="31" r="2" fill="#FB923C"/>

  <!-- Gimbal-Kamera -->
  <path d="M62 39v3.5" stroke="#6C81A1" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="62" cy="46" r="5" fill="#1E2A3C" stroke="rgba(214,169,82,.55)" stroke-width="1.2"/>
  <circle cx="62" cy="46" r="2.2" fill="#63E3F7" opacity=".85"/>

  <!-- Landefüße -->
  <g stroke="rgba(84,103,132,.55)" stroke-width="2" stroke-linecap="round">
    <path d="M52 39l-3 7"/>
    <path d="M80 39l3 7"/>
  </g>
</svg>
