<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="fan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      /* Der Kopf tastet den Raum rundum ab, dabei entsteht Punkt fuer Punkt
         die Wandkontur und daraus oben der fertige Grundriss. */
      @keyframes spin  { to { transform: rotate(360deg); } }
      @keyframes lens  { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes pop   { 0%, 8%  { opacity: 0; transform: scale(.2); }
                         18%     { opacity: 1; transform: scale(1.35); }
                         30%, 92% { opacity: .95; transform: scale(1); }
                         100%    { opacity: .95; transform: scale(1); } }
      @keyframes plan  { 0%, 20% { stroke-dashoffset: 300; }
                         70%, 100% { stroke-dashoffset: 0; } }
      @keyframes label { 0%, 62% { opacity: 0; } 78%, 100% { opacity: 1; } }

      .sweep { transform-box: view-box; transform-origin: 160px 138px;
               animation: spin 5s linear infinite; }
      .lens  { animation: lens 5s ease-in-out infinite; }
      .pt    { transform-box: fill-box; transform-origin: center;
               animation: pop 5s ease-out infinite; }
      .p2 { animation-delay: .30s } .p3 { animation-delay: .60s }
      .p4 { animation-delay: .90s } .p5 { animation-delay: 1.2s }
      .p6 { animation-delay: 1.5s } .p7 { animation-delay: 1.8s }
      .p8 { animation-delay: 2.1s } .p9 { animation-delay: 2.4s }
      .plan  { stroke-dasharray: 300; animation: plan 5s ease-in-out infinite; }
      .tag   { animation: label 5s ease-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .sweep, .lens, .pt, .plan, .tag {
          animation: none; opacity: 1; transform: none; stroke-dashoffset: 0;
        }
      }
    ]]></style>
  </defs>

  <!-- Ergebnis: Grundriss zeichnet sich -->
  <g class="plan" stroke="url(#sg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 30h136v54H92z"/>
    <path d="M158 30v30M158 74v10M92 60h38"/>
  </g>
  <g class="tag" fill="#7C8DA9">
    <rect x="120" y="92" width="80" height="3" rx="1.5" opacity=".5"/>
  </g>

  <!-- Wandkontur, die der Scan erfasst -->
  <path d="M44 118v112M276 118v112" stroke="#93A7C4" stroke-width="2.5"
        stroke-linecap="round" opacity=".35"/>

  <!-- Punktwolke auf den Waenden -->
  <g fill="#22D3EE">
    <circle class="pt"    cx="44" cy="132" r="4"/>
    <circle class="pt p2" cx="44" cy="166" r="4"/>
    <circle class="pt p3" cx="44" cy="200" r="4"/>
    <circle class="pt p4" cx="44" cy="228" r="4"/>
  </g>
  <g fill="#8B5CF6">
    <circle class="pt p5" cx="276" cy="132" r="4"/>
    <circle class="pt p6" cx="276" cy="166" r="4"/>
    <circle class="pt p7" cx="276" cy="200" r="4"/>
    <circle class="pt p8" cx="276" cy="228" r="4"/>
  </g>

  <!-- Rotierender Abtastfaecher -->
  <g class="sweep">
    <path d="M160 138 L286 116 L286 160 Z" fill="url(#fan)"/>
    <line x1="160" y1="138" x2="284" y2="138" stroke="#22D3EE" stroke-width="2.2"
          stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- Scankopf -->
  <rect x="141" y="106" width="38" height="64" rx="15" fill="#0F1828"
        stroke="#93A7C4" stroke-width="3"/>
  <circle class="lens" cx="160" cy="122" r="6.5" fill="none" stroke="url(#sg)" stroke-width="2.6"/>
  <circle cx="160" cy="140" r="8" fill="rgba(34,211,238,.10)" stroke="url(#sg)" stroke-width="2.8"/>
  <circle cx="160" cy="140" r="3" fill="#22D3EE"/>
  <circle class="lens" cx="160" cy="158" r="6.5" fill="none" stroke="url(#sg)" stroke-width="2.6"/>

  <!-- Saeule und Dreibein -->
  <rect x="153" y="170" width="14" height="42" rx="5" fill="#0F1828"
        stroke="#93A7C4" stroke-width="2.5"/>
  <g stroke="#93A7C4" stroke-width="4" stroke-linecap="round">
    <path d="M160 210 L112 284"/>
    <path d="M160 210v74"/>
    <path d="M160 210 L208 284"/>
  </g>
  <circle cx="160" cy="210" r="7" fill="#0F1828" stroke="#93A7C4" stroke-width="3"/>
</svg>
