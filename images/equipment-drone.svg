  <!-- Rumpf -->
  <rect x="122" y="104" width="76" height="122" rx="30" fill="#0B1017" stroke="#A08A5E" stroke-width="3"/>
  <rect x="134" y="150" width="52" height="46" rx="10" stroke="#A08A5E" stroke-width="2" opacity=".4"/>
  <circle cx="160" cy="112" r="13" fill="#0B1017" stroke="#A08A5E" stroke-width="3"/>
  <circle cx="160" cy="112" r="6" fill="url(#dg)"/>
  <circle cx="146" cy="212" r="3" fill="#A08A5E" opacity=".6"/>
  <circle cx="174" cy="212" r="3" fill="#A08A5E" opacity=".6"/>
