  </defs>

  <!-- Propeller -->
  <g stroke="url(#dg)" stroke-width="2.6">
    <circle cx="82" cy="82" r="42" stroke-dasharray="9 8"/>
    <circle cx="238" cy="82" r="42" stroke-dasharray="9 8"/>
    <circle cx="82" cy="238" r="42" stroke-dasharray="9 8"/>
    <circle cx="238" cy="238" r="42" stroke-dasharray="9 8"/>
  </g>

  <!-- Ausleger -->
