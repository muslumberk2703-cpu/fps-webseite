<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" fill="none">
  <defs>
    <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6428"/>
      <stop offset=".35" stop-color="#D6A952"/>
      <stop offset=".62" stop-color="#F8DDA7"/>
      <stop offset="1" stop-color="#C08A3E"/>
    </linearGradient>
  </defs>
  <!-- hoher Hauptturm rechts, schraege Spitze -->
  <path d="M74 128V26l16-22v124Z" fill="url(#lg)"/>
  <!-- zweiter Turm -->
