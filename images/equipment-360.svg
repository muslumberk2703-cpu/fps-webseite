  <path d="M250 168l8 10 11-5" stroke="url(#sg360)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Kameragehäuse (schlank, hochkant) -->
  <rect x="128" y="86" width="64" height="148" rx="16" fill="#0F1828" stroke="#93A7C4" stroke-width="3"/>
  <rect x="137" y="95" width="46" height="130" rx="10" stroke="#93A7C4" stroke-width="1.5" opacity=".3"/>

  <!-- Linse vorne -->
  <circle cx="160" cy="122" r="21" fill="#0B1119" stroke="#93A7C4" stroke-width="3"/>
