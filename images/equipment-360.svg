  </defs>

  <!-- Rundum-Bahnen -->
  <ellipse cx="160" cy="160" rx="118" ry="46" stroke="url(#sg360)" stroke-width="2.6" opacity=".75"/>
  <ellipse cx="160" cy="160" rx="118" ry="46" stroke="url(#sg360)" stroke-width="2.6" opacity=".4" transform="rotate(60 160 160)"/>
  <ellipse cx="160" cy="160" rx="118" ry="46" stroke="url(#sg360)" stroke-width="2.6" opacity=".4" transform="rotate(-60 160 160)"/>

