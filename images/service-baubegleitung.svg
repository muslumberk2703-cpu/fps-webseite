<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <!-- Baustelle im Hintergrund (dezent) -->
  <g opacity=".45">
    <!-- Kran -->
    <g stroke="#93A7C4" stroke-width="2.4" stroke-linecap="round">
      <line x1="46" y1="214" x2="46" y2="36"/>
      <line x1="22" y1="36" x2="128" y2="36"/>
      <line x1="46" y1="36" x2="32" y2="58"/>
      <line x1="46" y1="36" x2="62" y2="58"/>
      <line x1="104" y1="36" x2="104" y2="62"/>
    </g>
    <rect x="94" y="62" width="20" height="15" rx="3" stroke="#93A7C4" stroke-width="2.4" fill="none"/>

    <!-- Rohbau -->
    <g stroke="#93A7C4" stroke-width="2.4">
      <rect x="152" y="166" width="122" height="48" fill="rgba(148,163,184,.07)"/>
      <line x1="182" y1="166" x2="182" y2="214"/>
      <line x1="213" y1="166" x2="213" y2="214"/>
      <line x1="244" y1="166" x2="244" y2="214"/>
      <rect x="152" y="122" width="122" height="44" fill="rgba(148,163,184,.04)"/>
      <line x1="182" y1="122" x2="182" y2="166" opacity=".55"/>
      <line x1="213" y1="122" x2="213" y2="166" opacity=".55"/>
      <line x1="152" y1="122" x2="152" y2="86" stroke-dasharray="6 6"/>
      <line x1="213" y1="122" x2="213" y2="86" stroke-dasharray="6 6"/>
      <line x1="274" y1="122" x2="274" y2="86" stroke-dasharray="6 6"/>
      <line x1="152" y1="86" x2="274" y2="86" stroke-dasharray="6 6"/>
    </g>
    <line x1="20" y1="214" x2="300" y2="214" stroke="#93A7C4" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 360-Grad-Kamera im Vordergrund -->
  <!-- Rundum-Bahnen -->
  <ellipse cx="160" cy="222" rx="96" ry="34" stroke="url(#bg1)" stroke-width="2.6" opacity=".85"/>
  <ellipse cx="160" cy="222" rx="96" ry="34" stroke="url(#bg1)" stroke-width="2.4" opacity=".35" transform="rotate(62 160 222)"/>
  <ellipse cx="160" cy="222" rx="96" ry="34" stroke="url(#bg1)" stroke-width="2.4" opacity=".35" transform="rotate(-62 160 222)"/>

  <!-- Rotationspfeil -->
  <path d="M252 212a96 96 0 0 1-7 20" stroke="url(#bg1)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M239 227l7 9 10-5" stroke="url(#bg1)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Kameragehäuse -->
  <rect x="136" y="166" width="48" height="112" rx="13" fill="#0F1828" stroke="#93A7C4" stroke-width="3"/>
  <rect x="143" y="173" width="34" height="98" rx="8" stroke="#93A7C4" stroke-width="1.4" opacity=".3"/>

  <!-- Linse oben -->
  <circle cx="160" cy="193" r="16" fill="#0B1119" stroke="#93A7C4" stroke-width="2.8"/>
  <circle cx="160" cy="193" r="10" stroke="url(#bg1)" stroke-width="2.8"/>
  <circle cx="160" cy="193" r="4" fill="url(#bg1)"/>
  <circle cx="155.5" cy="188.5" r="1.9" fill="#E8EFF9" opacity=".75"/>

  <!-- Linse unten (Rückseite) -->
  <circle cx="160" cy="249" r="16" fill="#0B1119" stroke="#93A7C4" stroke-width="2.8"/>
  <circle cx="160" cy="249" r="9" stroke="url(#bg1)" stroke-width="2.4" opacity=".85"/>
  <circle cx="160" cy="249" r="3.2" fill="url(#bg1)" opacity=".85"/>

  <!-- Status + Taste -->
  <circle cx="160" cy="221" r="3" fill="url(#bg1)"/>
  <rect x="151" y="266" width="18" height="5.5" rx="2.75" fill="#93A7C4" opacity=".5"/>

  <!-- 360-Label -->
  <text x="160" y="303" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="21" font-weight="700" fill="url(#bg1)" letter-spacing="1.5">360°</text>
</svg>
