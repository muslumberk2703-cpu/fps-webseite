<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <style><![CDATA[
      /* Bauphase fuer Bauphase: der Fortschrittsbalken waechst, jeder Termin
         wird abgehakt und bringt eine Foto-Dokumentation mit. */
      @keyframes grow  { 0%, 6%  { stroke-dashoffset: 232; }
                         86%, 100% { stroke-dashoffset: 0; } }
      @keyframes tick  { 0%, 10%  { opacity: 0; transform: scale(.4); }
                         22%, 100% { opacity: 1; transform: scale(1); } }
      @keyframes shot  { 0%, 14%  { opacity: 0; transform: translateY(12px) scale(.85); }
                         28%, 92% { opacity: 1; transform: translateY(0) scale(1); }
                         100%     { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes storey { 0%, 30% { opacity: .12; } 55%, 100% { opacity: .5; } }

      .bar   { stroke-dasharray: 232; animation: grow 8s ease-in-out infinite; }
      .tick  { transform-box: fill-box; transform-origin: center;
               animation: tick 8s ease-out infinite; }
      .t2 { animation-delay: 1.4s } .t3 { animation-delay: 2.8s } .t4 { animation-delay: 4.2s }
      .shot  { transform-box: fill-box; transform-origin: center bottom;
               animation: shot 8s ease-out infinite; }
      .s2 { animation-delay: 1.4s } .s3 { animation-delay: 2.8s }
      .top   { animation: storey 8s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .bar, .tick, .shot, .top {
          animation: none; opacity: 1; transform: none; stroke-dashoffset: 0;
        }
      }
    ]]></style>
  </defs>

  <!-- Baustelle im Hintergrund -->
  <g opacity=".42">
    <g stroke="#93A7C4" stroke-width="2.4" stroke-linecap="round">
      <line x1="42" y1="196" x2="42" y2="26"/>
      <line x1="18" y1="26" x2="124" y2="26"/>
      <line x1="42" y1="26" x2="28" y2="48"/>
      <line x1="42" y1="26" x2="58" y2="48"/>
      <line x1="100" y1="26" x2="100" y2="52"/>
    </g>
    <rect x="90" y="52" width="20" height="15" rx="3" stroke="#93A7C4" stroke-width="2.4" fill="none"/>

    <g stroke="#93A7C4" stroke-width="2.4">
      <rect x="150" y="150" width="126" height="46" fill="rgba(148,163,184,.07)"/>
      <line x1="181" y1="150" x2="181" y2="196"/>
      <line x1="213" y1="150" x2="213" y2="196"/>
      <line x1="245" y1="150" x2="245" y2="196"/>
      <rect x="150" y="106" width="126" height="44" fill="rgba(148,163,184,.04)"/>
      <line x1="181" y1="106" x2="181" y2="150" opacity=".55"/>
      <line x1="213" y1="106" x2="213" y2="150" opacity=".55"/>
    </g>
    <line x1="20" y1="196" x2="300" y2="196" stroke="#93A7C4" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- geplantes Obergeschoss, wird im Verlauf fester -->
  <g class="top" stroke="#93A7C4" stroke-width="2.4" stroke-dasharray="6 6">
    <path d="M150 106V68M213 106V68M276 106V68M150 68h126"/>
  </g>

  <!-- Foto-Dokumentation je Termin -->
  <g class="shot">
    <rect x="42" y="212" width="62" height="46" rx="7" fill="#0F1828" stroke="url(#bg1)" stroke-width="2.6"/>
    <path d="M52 248l14-15 10 10 7-7 9 12" stroke="#93A7C4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="86" cy="226" r="4.5" fill="#22D3EE" opacity=".9"/>
  </g>
  <g class="shot s2">
    <rect x="128" y="212" width="62" height="46" rx="7" fill="#0F1828" stroke="url(#bg1)" stroke-width="2.6"/>
    <path d="M138 248l14-15 10 10 7-7 9 12" stroke="#93A7C4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="172" cy="226" r="4.5" fill="#8B5CF6" opacity=".9"/>
  </g>
  <g class="shot s3">
    <rect x="214" y="212" width="62" height="46" rx="7" fill="#0F1828" stroke="url(#bg1)" stroke-width="2.6"/>
    <path d="M224 248l14-15 10 10 7-7 9 12" stroke="#93A7C4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="258" cy="226" r="4.5" fill="#FB923C" opacity=".9"/>
  </g>

  <!-- Zeitstrahl der Bauphasen -->
  <line x1="44" y1="288" x2="276" y2="288" stroke="#93A7C4" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  <line class="bar" x1="44" y1="288" x2="276" y2="288" stroke="url(#bg1)" stroke-width="3.4" stroke-linecap="round"/>

  <g fill="#0B1119" stroke="url(#bg1)" stroke-width="2.8">
    <circle cx="44" cy="288" r="9"/>
    <circle cx="121" cy="288" r="9"/>
    <circle cx="198" cy="288" r="9"/>
    <circle cx="276" cy="288" r="9"/>
  </g>
  <g stroke="#22D3EE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path class="tick"    d="M40 288l3 3.5 5.5-6.5"/>
    <path class="tick t2" d="M117 288l3 3.5 5.5-6.5"/>
    <path class="tick t3" d="M194 288l3 3.5 5.5-6.5"/>
    <path class="tick t4" d="M272 288l3 3.5 5.5-6.5"/>
  </g>
</svg>
