<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB923C" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Zielwand rechts -->
  <line x1="286" y1="52" x2="286" y2="268" stroke="#93A7C4" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>

  <!-- Laserstrahl -->
  <line x1="196" y1="120" x2="284" y2="120" stroke="url(#beam)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="286" cy="120" r="5" fill="#FB923C"/>
  <circle cx="286" cy="120" r="11" stroke="#FB923C" stroke-width="2" opacity=".45"/>

  <!-- Messlinie mit Pfeilen -->
  <g stroke="#7C8DA9" stroke-width="1.8" opacity=".85">
    <line x1="196" y1="156" x2="286" y2="156" stroke-dasharray="6 5"/>
    <line x1="196" y1="150" x2="196" y2="162"/>
    <line x1="286" y1="150" x2="286" y2="162"/>
  </g>

  <!-- Gehäuse (Handgerät, hochkant) -->
  <rect x="96" y="62" width="100" height="196" rx="18" fill="#0F1828" stroke="#93A7C4" stroke-width="3"/>
  <rect x="106" y="72" width="80" height="176" rx="12" stroke="#93A7C4" stroke-width="1.5" opacity=".3"/>

  <!-- Austrittsöffnung vorn -->
  <rect x="188" y="106" width="12" height="28" rx="4" fill="#0F1828" stroke="#93A7C4" stroke-width="2.5"/>

  <!-- Display -->
  <rect x="112" y="86" width="68" height="52" rx="7" fill="rgba(34,211,238,.08)" stroke="url(#lg2)" stroke-width="2.5"/>
  <line x1="122" y1="104" x2="170" y2="104" stroke="url(#lg2)" stroke-width="4" stroke-linecap="round"/>
  <line x1="132" y1="118" x2="170" y2="118" stroke="#93A7C4" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <line x1="142" y1="130" x2="170" y2="130" stroke="#93A7C4" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>

  <!-- Tasten -->
  <g fill="#93A7C4" opacity=".55">
    <rect x="118" y="156" width="24" height="9" rx="4.5"/>
    <rect x="150" y="156" width="24" height="9" rx="4.5"/>
    <rect x="118" y="176" width="24" height="9" rx="4.5"/>
    <rect x="150" y="176" width="24" height="9" rx="4.5"/>
  </g>
  <rect x="126" y="204" width="40" height="14" rx="7" fill="none" stroke="url(#lg2)" stroke-width="2.5"/>

  <!-- Anschlagfuß unten -->
  <line x1="112" y1="258" x2="180" y2="258" stroke="#93A7C4" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</svg>
